# fluent-bit 采集管线：tail docker 容器日志文件 -> 解析 -> 输出 json_lines 给 AIOps 平台
# 生产环境把 Path 换成 /var/lib/docker/containers/*/*-json.log

[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Path         /var/lib/docker/containers/*/*-json.log
    Parser       docker
    Tag          container.*
    Refresh_Interval 5
    Read_from_Head   False

[FILTER]
    Name         parser
    Match        container.*
    Key_Name     log
    Parser       multiline_java
    Reserve_Data True

[FILTER]
    Name         record_modifier
    Match        container.*
    Record       service ${TAG_PARTS[container_name]}

[OUTPUT]
    Name         file
    Match        *
    FilePath     state/containers.log
    Format       json_lines
