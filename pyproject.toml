[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-platform"
version = "0.1.0"
description = "轻量级 AIOps 自动化运维平台（自研 · 零第三方依赖）"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

# 无运行时第三方依赖：仅标准库 (urllib/socket/tomllib/hashlib/argparse)

[project.optional-dependencies]
dev = ["ruff==0.13.1"]

[project.scripts]
aiops = "aiops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aiops"]
